name: Windows index check
on:
  workflow_dispatch:
jobs:
  index:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s test -p 'test_*.py'
